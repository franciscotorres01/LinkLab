<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>LinkLab - Registro</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 32px; border-radius: 8px; width: 320px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1); }
        input { width: 100%; padding: 10px; margin: 8px 0 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 12px; background: #2563eb; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
        .error { color: #b91c1c; font-size: 13px; margin-bottom: 8px; }
        a { color: #2563eb; }
    </style>
</head>
<body>
<div class="card">
    <h2>Crear cuenta</h2>

    <form th:action="@{/registro}" th:object="${form}" method="post">
        <label>Correo</label>
        <input type="email" th:field="*{email}">
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label>Contraseña</label>
        <input type="password" th:field="*{password}">
        <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

        <label>Confirmar contraseña</label>
        <input type="password" th:field="*{confirmPassword}">
        <div class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>

        <button type="submit">Registrarme</button>
    </form>

    <p>¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
</div>
</body>
</html>
