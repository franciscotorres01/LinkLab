<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkLab - Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="auth">

<aside class="auth-brand">
    <div class="logo"><span class="logo-icon">&gt;_</span><span class="logo-text">LinkLab</span></div>
    <div class="brand-copy">
        <span class="eyebrow">Simulador de enlace</span>
        <h1>Crea tu cuenta y empieza a simular</h1>
        <p>Guarda escenarios, ejecuta simulaciones y revisa tu historial cuando quieras</p>
    </div>
    <small>© LinkLab</small>
</aside>

<main class="auth-main">
    <div class="top-action"><a class="btn-top" th:href="@{/login}">Iniciar sesión</a></div>
    <div class="card">
        <h2>Crear cuenta</h2>
        <p class="subtitle">Solo toma un minuto</p>

        <form th:action="@{/registro}" th:object="${form}" method="post">
            <label for="email">Correo</label>
            <input id="email" type="email" th:field="*{email}" placeholder="tu@correo.com"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <label for="password">Contraseña</label>
            <input id="password" type="password" th:field="*{password}" placeholder="Mínimo 8 caracteres"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <label for="confirmPassword">Confirmar contraseña</label>
            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Repite tu contraseña"
                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
            <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>

            <button type="submit" class="btn">Registrarme</button>
        </form>
    </div>
</main>

</body>
</html>
