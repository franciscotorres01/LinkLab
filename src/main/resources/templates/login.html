<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>LinkLab - Iniciar sesión</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8;
               display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 32px; border-radius: 8px; width: 320px;
                box-shadow: 0 2px 10px rgba(0,0,0,.1); }
        input { width: 100%; padding: 10px; margin: 8px 0 16px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
        .error { color: #b91c1c; margin-bottom: 12px; }
        .ok { color: #15803d; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Iniciar sesión</h2>

    <div th:if="${param.error}" class="error">Correo o contraseña incorrectos.</div>
    <div th:if="${param.logout}" class="ok">Cerraste sesión correctamente.</div>
    <div th:if="${param.registrado}" class="ok">Cuenta creada. Ya puedes iniciar sesión.</div>

    <form th:action="@{/login}" method="post">
        <label>Correo</label>
        <input type="email" name="username" required>

        <label>Contraseña</label>
        <input type="password" name="password" required>

        <button type="submit">Entrar</button>
    </form>
    <p>¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
</div>
</body>
</html>
