<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <style>
        body { background: #ffffff; }
        .home-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 32px; border-bottom: 1px solid var(--border);
        }
        .home-bar .logo-text { color: var(--text); }
        .home-user { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
        .home-user form { margin: 0; }
        .home-user button {
            padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 600;
            color: var(--text); background: var(--surface);
            border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
        }
        .home-user button:hover { background: var(--bg); }
    </style>
</head>
<body>
<header class="home-bar">
    <div class="logo"><span class="logo-icon" style="color:#fff">&gt;_</span><span class="logo-text">LinkLab</span></div>
    <div class="home-user">
        <span sec:authentication="name">usuario</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Cerrar sesión</button>
        </form>
    </div>
</header>

<main></main>
</body>
</html>
